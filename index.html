<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto para Alura</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        header, footer {
            text-align: center;
            background: #333;
            color: white;
            padding: 1rem;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colunas */
            gap: 20px;
            padding: 20px;
        }

        nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #333;
            color: #fff;
        }

        main {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

    </nav>

</body>
</html>
