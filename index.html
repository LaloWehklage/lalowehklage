<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto para Alura</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        header {
            text-align: center;
            background: #333;
            color: white;
            padding: 1rem;
        }

        nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* se adapta ao tamanho da tela */
    gap: 20px;
    padding: 20px;
}

nav a {
    display: flex;
    flex-direction: column; /* conteúdo em coluna */
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 8px;
    padding: 30px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    transition: transform 0.2s ease, background 0.3s ease, color 0.3s ease;
}

nav a:hover {
    background: #333;
    color: #fff;
    transform: translateY(-5px); 
}

        main {
            text-align: center;
            padding: 20px;
        }
footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #333;
    color: white;
    text-align: center;
    padding: 1rem;
}

        
    </style>
</head>
<body>

        <a href="https://editor.p5js.org/" target="_blank" rel="noopener noreferrer">P5.JS</a>
    </nav>

    <footer>

    </footer>
</body>
</html>
